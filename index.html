<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tela de login</title>
</head>
<body>
    <div id="login">

        <h1>Entrar</h1>
        <p class="descricao"> Acesse sua conta para continuar</p>

        <form id="formLogin" class="acesso" novalidate>

            <div class="caixa-de-entrada">
                <input type="text" id="usuario" placeholder="Email ou telefone...">
                <span class="erro" id="erroUsuario"></span>

                <input type="password" id="senha" placeholder="Insira a sua senha...">
                <span class="erro" id="erroSenha"></span>
            </div>

            <button type="submit">Acessar</button>
            <br><br>

            <p id="mensagemSucesso" class="sucesso"></p>

            <div class="cadastro">
                <p>
                    Ola! Tudo bem? Bem vindo ao site
                </p>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
