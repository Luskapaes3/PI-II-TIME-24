<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Cadastro</title>
</head>
<body>

    <!-- Div que agrupa os campos e o botão de acesso -->
    <div id="cadastro">
        <h1>Cadastro</h1>
        <p class="descricao">Crie uma conta para começar</p>

         <!-- Div que agrupa os campos e o botão de cadastro -->
        <div class="acesso">

            <!-- Div que contém os campos de entrada -->
            <div class="caixa-de-entrada">

                <input type="text" placeholder= "Insira o seu Email ou telefone...">

                <!-- Campo para o usuário criar uma senha -->
                <!-- type="password" esconde os caracteres digitados -->
                <input type="password" placeholder="Crie uma senha...">
            </div>

            <a href="https://www.rockstargames.com/VI" target="_blank">
                <button type="button">Cadastrar</button><br>
            </a>
            <br>

         <!-- Área para usuários que já possuem uma conta -->
        <div class = "cadastro">

            <p>
                Já possui uma conta?
            </p>
            <!-- Link que leva para a página de login -->
            <a href="../login/index.html">Faça o login</a>
        </div>
    </div>
    </div>
</body>
</html>
