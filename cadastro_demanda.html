<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Demanda</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="titulo-introducao">
        <div>
            <h1>Cadastrar Demanda</h1>
            <p>Preencha as informações abaixo para registrar uma nova demanda.</p>
        </div>
        <a class="btn-voltar" href="lista_demandas(1).html">Voltar para a Listagem</a>
    </header>

    <main class="conteudo-principal">
        <form id="formDemanda" novalidate>
            <section class="secao-formulario">
                <h2>Informações da Demanda</h2>

                <div class="campo campo-largo">
                    <label for="titulo">Título da demanda</label>
                    <input type="text" id="titulo" required minlength="5" maxlength="100">
                    <div id="erroTitulo" class="erro"></div>
                </div>

                <div class="campo campo-largo">
                    <label for="descricao">Descrição da demanda</label>
                    <textarea id="descricao" rows="5" required minlength="10" maxlength="500"></textarea>
                    <div id="erroDescricao" class="erro"></div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="tipo">Tipo da demanda</label>
                        <select id="tipo" required>
                            <option value="">Selecione</option>
                            <option value="tarefa">Tarefa</option>
                            <option value="defeito">Defeito</option>
                            <option value="melhoria">Melhoria</option>
                            <option value="documentacao">Documentação</option>
                        </select>
                        <div id="erroTipo" class="erro"></div>
                    </div>

                    <div class="campo">
                        <label for="prioridade">Prioridade</label>
                        <select id="prioridade" required>
                            <option value="">Selecione</option>
                            <option value="baixa">Baixa</option>
                            <option value="media">Média</option>
                            <option value="alta">Alta</option>
                            <option value="critica">Crítica</option>
                        </select>
                        <div id="erroPrioridade" class="erro"></div>
                    </div>
                </div>

                <div class="linha">
                    <div class="campo">
                        <label for="status">Status</label>
                        <select id="status" required>
                            <option value="">Selecione</option>
                            <option value="aberta">Aberta</option>
                            <option value="andamento">Em andamento</option>
                            <option value="revisao">Em revisão</option>
                            <option value="concluida">Concluída</option>
                            <option value="cancelada">Cancelada</option>
                        </select>
                        <div id="erroStatus" class="erro"></div>
                    </div>

                    <div class="campo">
                        <label for="projeto">Projeto associado</label>
                        <select id="projeto" required>
                            <option value="">Selecione um projeto</option>
                            <option value="projeto1">Projeto 1</option>
                            <option value="projeto2">Projeto 2</option>
                            <option value="projeto3">Projeto 3</option>
                        </select>
                        <div id="erroProjeto" class="erro"></div>
                    </div>
                </div>

                <div class="campo campo-data">
                    <label for="dataLimite">Data limite</label>
                    <input type="date" id="dataLimite" required>
                    <div id="erroData" class="erro"></div>
                </div>
            </section>

            <div class="botoes-acao">
                <button type="button" id="btnCancelar" class="btn-secundario">Cancelar</button>
                <button type="submit" class="btn-principal">Salvar Demanda</button>
            </div>
        </form>

        <section id="painelResultado" class="resultado" style="display: none;">
            <h2>Demanda cadastrada</h2>
            <pre id="resultado"></pre>
        </section>
    </main>

    <footer class="footer">
        <p>© Sistema de Gerenciamento de Demandas</p>
    </footer>
</body>
</html>
