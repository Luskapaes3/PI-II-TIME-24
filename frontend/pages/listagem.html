<!-- Tela de Listagem de Demandas: filtros, busca, ordenação e link para os detalhes -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de demandas</title>
    <link rel="stylesheet" href="/css/listagem.css">
</head>
<body>

    <!-- Titulo/Parte superior -->
    <div class="titulo-introducao">
        <div>
            <h1>Listagem de Demandas</h1>
            <p>Gerencie e Acompanhe todas as demandas cadastradas.</p>
        </div>
        <a class="lateral-direita" href="/pages/cadastro.html">Nova demanda</a>
    </div>

    <!-- Barra de busca e filtros -->
    <form class="barra-busca" id="formFiltros">

        <p>Buscar</p>
        <input type="text" id="busca" placeholder="Título ou descrição">

        <p>Tipo</p>
        <select id="filtroTipo">
            <option value="">Todos</option>
            <option>Tarefa</option>
            <option>Defeito</option>
            <option>Melhoria</option>
            <option>Documentação</option>
        </select>

        <p>Prioridade</p>
        <select id="filtroPrioridade">
            <option value="">Todas</option>
            <option>Crítica</option>
            <option>Alta</option>
            <option>Média</option>
            <option>Baixa</option>
        </select>

        <p>Status</p>
        <select id="filtroStatus">
            <option value="">Todos</option>
            <option>Aberta</option>
            <option>Em andamento</option>
            <option>Em revisão</option>
            <option>Concluída</option>
            <option>Cancelada</option>
        </select>

        <p>Ordenar por</p>
        <select id="ordenar">
            <option value="">Mais antigas primeiro</option>
            <option value="prioridade">Prioridade</option>
            <option value="status">Status</option>
            <option value="dataCriacao">Data de criação</option>
            <option value="prazo">Prazo</option>
        </select>

        <button type="submit">Filtrar</button>
    </form>

    <!-- Mensagem de carregando, lista vazia ou erro -->
    <p class="mensagem" id="mensagem"></p>

    <!-- Tabela de demandas (as linhas são montadas pelo listagem.js) -->
    <div class="tabela-demandas">
        <table>
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Tipo</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                    <th>Responsável</th>
                    <th>Data de criação</th>
                    <th>Prazo</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© Sistema de Gerenciamento de Demandas</p>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/listagem.js"></script>
</body>
</html>
